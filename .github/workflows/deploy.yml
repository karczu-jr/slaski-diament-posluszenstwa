name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Lub master, zależnie od nazwy Twojej głównej gałęzi

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload Astro site
        uses: withastro/action@v3 # Automatycznie wykrywa npm/pnpm/yarn, instaluje i buduje projekt

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
